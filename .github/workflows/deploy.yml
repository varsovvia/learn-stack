name: Deploy learn-stack

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Validate Development Config
      run: |
        docker compose -f compose.yml -f compose.dev.yml config
        
    - name: Validate Production Config
      run: |
        docker compose -f compose.yml -f compose.prod.yml config
        
    - name: Build Development Images
      run: |
        docker compose -f compose.yml -f compose.dev.yml build
        
    - name: Run Basic Tests
      run: |
        echo "✅ Development configuration is valid"
        echo "✅ Production configuration is valid"
        echo "✅ All images built successfully"

  deploy-dev:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: development
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Development
      run: |
        echo "🚀 Deploying to development environment"
        echo "This would run: ./scripts/deploy.sh dev"

  deploy-prod:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Production
      run: |
        echo "🚀 Deploying to production environment"
        echo "This would run: ./scripts/deploy.sh prod"
